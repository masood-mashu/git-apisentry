name: semver-drift-calculator
version: 1.0.0
description: "Verifies that the proposed version increment matches the contract change classification"
input_schema:
  type: object
  properties:
    version_pair_json:
      type: string
      description: "JSON string containing current_version, proposed_version, and change_type (BREAKING or ADDITIVE)"
  required:
    - version_pair_json
implementation:
  type: script
  path: semver_drift_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
